name: dermascope-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/monolith.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
